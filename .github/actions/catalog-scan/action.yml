name: Scan Ashita addon artifact
description: Treats a package manifest and release ZIP as untrusted data and emits a report.
inputs:
  manifest:
    description: Path to package manifest
    required: true
  actor:
    description: GitHub actor submitting the package
    required: true
  output:
    description: Scan report path
    required: false
    default: scan-report.json
  previous-root:
    description: Trusted base catalog packages directory
    required: false
    default: ''
  review-root:
    description: Trusted directory containing package semantic-review baselines
    required: false
    default: reviews
  semantic-output:
    description: Directory for semantic reports and review candidates
    required: false
    default: semantic-review
  token:
    description: GitHub token used for source authorization checks
    required: true
runs:
  using: composite
  steps:
    - name: Verify source authorization
      shell: bash
      env:
        VH_MANIFEST: ${{ inputs.manifest }}
        VH_ACTOR: ${{ inputs.actor }}
        VH_PREVIOUS_ROOT: ${{ inputs['previous-root'] }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        args=("$GITHUB_ACTION_PATH/../../../tools/verify_submission.py" "$VH_MANIFEST" --actor "$VH_ACTOR")
        if [[ -n "$VH_PREVIOUS_ROOT" ]]; then args+=(--previous-root "$VH_PREVIOUS_ROOT"); fi
        python3 "${args[@]}"
    - name: Scan artifact
      shell: bash
      env:
        VH_MANIFEST: ${{ inputs.manifest }}
        VH_OUTPUT: ${{ inputs.output }}
        VH_REVIEW_ROOT: ${{ inputs['review-root'] }}
        VH_SEMANTIC_OUTPUT: ${{ inputs['semantic-output'] }}
      run: |
        bash "$GITHUB_ACTION_PATH/../../../tools/scan_catalog_package.sh" \
          "$VH_MANIFEST" "$VH_OUTPUT" "$VH_REVIEW_ROOT" "$VH_SEMANTIC_OUTPUT"
